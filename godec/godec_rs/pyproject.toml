[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "godec_rs"
version = "0.1.0"
description = "Rust implementation of GoDec with Python bindings"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
]