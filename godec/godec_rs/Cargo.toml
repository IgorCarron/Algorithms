[package]
name = "godec_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "godec_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"
nalgebra = "0.32"
rand = "0.8"
rand_distr = "0.4"
rustfft = "6"
fwht = "0.1.0"
openblas-src = { version = "0.10", features = ["system", "cblas"], optional = true }
cblas = { version = "0.4", optional = true }

[features]
default = ["blas"]
blas = ["dep:openblas-src", "dep:cblas"]
